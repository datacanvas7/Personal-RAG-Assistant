[alembic]
script_location = %(here)s/alembic
# Revision files sort chronologically in the directory listing.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# The database URL is not configured here: alembic/env.py builds it from the
# application settings so credentials live in exactly one place.
prepend_sys_path = .
