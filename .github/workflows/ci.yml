name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Throwaway database for tests/integration. The "_test" suffix is what unlocks those
    # tests (they drop and recreate the schema).
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_DB: rag_test
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: rag_test
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ci-only-password
      JWT_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests alembic
      - name: Tests (unit + database integration)
        run: uv run pytest
      - name: requirements.txt matches uv.lock
        run: uv export --frozen --no-dev --no-hashes --no-emit-project --no-header -o /tmp/requirements.txt && diff -u requirements.txt /tmp/requirements.txt

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  compose-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - name: Build and start the stack (waits for every health check)
        run: docker compose up --build --wait --wait-timeout 300
      - name: API reports Postgres, pgvector and Redis healthy
        run: |
          curl --fail --silent --show-error http://localhost:8000/api/v1/health | tee /dev/stderr \
            | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok', d"
      - name: Frontend proxies the API
        run: |
          curl --fail --silent --show-error http://localhost:3000/api/v1/health \
            | python3 -c "import sys,json; assert json.load(sys.stdin)['status']=='ok'"
      - name: Migrations ran and auth works end to end through the frontend proxy
        run: |
          set -euo pipefail
          base=http://localhost:3000/api/v1
          creds='{"email":"ci@example.com","password":"a-reasonable-passphrase"}'
          curl -fsS -X POST -H 'Content-Type: application/json' -d "$creds" $base/auth/register
          echo
          token=$(curl -fsS -c jar.txt -X POST -H 'Content-Type: application/json' -d "$creds" $base/auth/login             | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          grep -q refresh_token jar.txt
          curl -fsS -H "Authorization: Bearer $token" $base/users/me | tee /dev/stderr             | python3 -c "import sys,json; assert json.load(sys.stdin)['email']=='ci@example.com'"
          echo
          test "$(curl -s -o /dev/null -w '%{http_code}' $base/users/me)" = 401
          curl -fsS -b jar.txt -c jar.txt -X POST $base/auth/refresh > /dev/null
          curl -fsS -b jar.txt -X POST $base/auth/logout
          test "$(curl -s -o /dev/null -w '%{http_code}' -b jar.txt -X POST $base/auth/refresh)" = 401
      - name: Worker executes a task
        run: |
          docker compose exec -T backend python -c "
          from app.workers.tasks import ping
          assert ping.delay().get(timeout=20) == 'pong'
          print('celery ping ok')"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - if: always()
        run: docker compose down --volumes
